name: Wellspan checks

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test ./... -count=1
      - run: go vet ./...

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wellspan:ci .
      - run: bash tests/container-smoke.sh

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p .tmp && go build -o .tmp/wellspan-e2e ./cmd/wellspan
      - run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.config.mjs

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy.sh
      - run: bash tests/deploy.test.sh
